<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bay</title>
<!-- Favicon inline (SVG data URI): tanpa ini browser meminta
     /favicon.ico dan serve.ts menjawab 404 di console. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e1a'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='900' fill='%2322e6ff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0e1a;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: crosshair;
  }
  #fallback {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8ef6ff;
    font: 16px/1.5 system-ui, sans-serif;
    letter-spacing: 0.12em;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Neon Bay: game open-world top-down. WASD untuk jalan, E masuk mobil, klik kiri menembak."></canvas>
<div id="fallback">NEON BAY — memuat…</div>
<noscript><p style="color:#f2f5ff;font:16px system-ui,sans-serif;text-align:center">Neon Bay butuh JavaScript aktif.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
